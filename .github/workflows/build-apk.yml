name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      # NOTE: do NOT use android-actions/setup-android here — v3 is broken
      # (it tries to install the long-removed "tools" package and fails).
      # The ubuntu-24.04 runner image already ships an Android SDK; we only
      # need to accept licenses and make sure API 36 packages are present.
      # (Google Play requires targetSdk 36 for app updates since 2026-08-31.)
      - name: Set up Android SDK packages
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            CT="$ANDROID_HOME/cmdline-tools/latest"
          else
            CT="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -n1)"
          fi
          echo "Using cmdline-tools: $CT"
          export PATH="$CT/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace > gradle-test.log 2>&1
          code=$?
          echo "Gradle exit code: $code"
          echo "### Failing output (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 30 "What went wrong" gradle-test.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: warn

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Compile instrumented UI tests
        # Compiles androidTest sources; execution needs an emulator.
        run: ./gradlew :app:assembleAndroidTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # This is an *unsigned debug* APK built by CI for testing — not a
      # signed release and not an AAB. Publish to Play via a signed
      # release build / AAB (see README "Release builds").
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morse-translator-2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
