name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: do NOT use android-actions/setup-android here — v3 is broken
      # (it tries to install the long-removed "tools" package and fails).
      # The ubuntu-24.04 runner image already ships an Android SDK; we only
      # need to accept licenses and make sure API 34 packages are present.
      - name: Set up Android SDK packages
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            CT="$ANDROID_HOME/cmdline-tools/latest"
          else
            CT="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -n1)"
          fi
          echo "Using cmdline-tools: $CT"
          export PATH="$CT/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle
        run: |
          set -e
          GRADLE_VERSION=8.10.2
          rm -rf "$HOME/gradle-dist" /tmp/gradle.zip
          curl -sSL --retry 3 --retry-delay 5 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          test -s /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morse-translator-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
